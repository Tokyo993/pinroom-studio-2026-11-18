<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d11">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="PinStudio — вдохновляйся, сохраняй и редактируй изображения в одном приложении.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.wikimedia.org; connect-src 'self' https://commons.wikimedia.org; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>PinStudio — пространство для идей</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <header class="header">
    <a class="brand" href="#/" aria-label="PinStudio — главная"><span class="brand-icon">P</span>PinStudio</a>
    <nav class="desktop-nav" aria-label="Основная навигация"><a href="#/" data-nav="feed">Лента</a><a href="#/boards" data-nav="boards">Коллекции</a></nav>
    <form id="search-form" class="search" role="search"><span data-icon="search"></span><input id="search" aria-label="Найти идеи" placeholder="Найди своё вдохновение" maxlength="150" autocomplete="off"><button type="button" data-action="clear-search" aria-label="Очистить поиск"><span data-icon="close"></span></button><button class="search-submit" type="submit" aria-label="Искать"><span data-icon="search"></span></button></form>
    <button class="create-top" data-action="upload"><span data-icon="plus"></span><span>Создать</span></button>
    <button class="header-search icon-button" data-action="focus-search" aria-label="Поиск"><span data-icon="search"></span></button>
    <a class="avatar" href="#/boards" aria-label="Мои коллекции"><span data-icon="user"></span></a>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="mobile-nav" aria-label="Мобильная навигация"><a href="#/" data-nav="feed"><span data-icon="home"></span><span>Лента</span></a><button data-action="focus-search" data-nav="search"><span data-icon="search"></span><span>Поиск</span></button><button class="mobile-create" data-action="upload" aria-label="Создать из фотографии"><span data-icon="plus"></span></button><a href="#/boards" data-nav="boards"><span data-icon="collections"></span><span>Коллекции</span></a><button data-action="about"><span data-icon="info"></span><span>О проекте</span></button></nav>
  <input type="file" id="upload" accept="image/jpeg,image/png,image/webp" hidden>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <footer class="footer"><span>PinStudio · Вдохновляйся. Сохраняй. Создавай.</span><button data-action="about">О проекте и приватности</button></footer>
</body>
</html>
